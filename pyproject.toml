[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgat-paper"
version = "0.1.0"
description = "Reproducibility package for the FlowGAT vascular-flow surrogate audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "A. Daniel Cieslak", email = "cieslak.a.daniel@gmail.com" }
]
keywords = [
  "graph neural networks",
  "cardiovascular hemodynamics",
  "computational fluid dynamics",
  "feature leakage",
  "reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
training = [
  "torch>=2.7",
  "torch-geometric>=2.5",
  "pyvista>=0.43",
  "vtk>=9.3",
  "trimesh>=4.0",
  "scikit-image>=0.22",
  "wandb>=0.16",
]
dev = [
  "pytest>=8",
]

[project.urls]
Repository = "https://github.com/Dyniel/flowgat-paper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
